name: Deploy Health Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: health-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: health_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d health_hub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HEALTH_HUB_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/health_hub_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: api/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test the application
        run: |
          npm ci --prefix web
          npm run check --prefix web
          (cd api && go test -race -p 1 -count=1 ./... && go vet ./...)
          python -m pip install './importer[test]'
          pytest importer/tests
      - name: Build production images
        run: |
          docker build --build-arg APP_COMMIT="$GITHUB_SHA" --tag "health-hub-api:$GITHUB_SHA" .
          docker build --file importer/Dockerfile --build-arg APP_COMMIT="$GITHUB_SHA" --tag "health-hub-importer:$GITHUB_SHA" .
          docker run --rm --entrypoint /bin/sh "health-hub-api:$GITHUB_SHA" -c 'test -x /usr/local/bin/health-hub-migrate && test -s /app/web/deployment.json'
          docker run --rm --entrypoint python "health-hub-importer:$GITHUB_SHA" -c 'import health_hub_garmin.control_cli'
      - name: Publish an immutable public image archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo 'Main advanced; its newer workflow will publish the next release.'
            exit 0
          fi
          if ! gh release view "web-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            docker save "health-hub-api:$GITHUB_SHA" "health-hub-importer:$GITHUB_SHA" | gzip -1 > health-images.tar.gz
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const sha256=crypto.createHash('sha256').update(fs.readFileSync('health-images.tar.gz')).digest('hex');
          fs.writeFileSync('deployment.json',JSON.stringify({schema:1,commit:process.env.GITHUB_SHA,images:{api:`health-hub-api:${process.env.GITHUB_SHA}`,importer:`health-hub-importer:${process.env.GITHUB_SHA}`},sha256,runId:process.env.GITHUB_RUN_ID},null,2));
          JS
            gh release create "web-$GITHUB_SHA" health-images.tar.gz deployment.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Health Hub build $GITHUB_SHA" --notes 'Tested production API/dashboard and Garmin importer images. The deployment tag is added only after Kai reports this commit healthy.' --latest
          fi
      - name: Verify Kai and tag the successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 100); do
            current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo 'Superseded by a newer main commit.'
              exit 0
            fi
            if curl --fail --silent --show-error --max-time 10 "https://health.domyshev.com/deployment.json?expected=$GITHUB_SHA&attempt=$attempt" > live.json && node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("live.json")).commit!==process.env.GITHUB_SHA)process.exit(1)' && curl --fail --silent --show-error --max-time 10 https://health.domyshev.com/health/ready > health.json && node --input-type=module -e 'import fs from "node:fs";const h=JSON.parse(fs.readFileSync("health.json"));if(h.status!=="ready")process.exit(1)'; then
              tag="deploy-web-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
              printf '### Web deployment verified\n\nCommit: `%s`\n\nTag: `%s`\n\nURL: https://health.domyshev.com/\n' "$GITHUB_SHA" "$tag" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo 'Kai did not confirm this release; no successful-deployment tag was created.' >&2
          exit 1
