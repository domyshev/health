services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_hub}
      POSTGRES_USER: ${POSTGRES_USER:-health_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - health-hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_hub} -d ${POSTGRES_DB:-health_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  health-hub-postgres:
